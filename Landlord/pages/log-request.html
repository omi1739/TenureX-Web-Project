<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Maintenance Request — TenureX</title>

  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700,800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } },
    };
  </script>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="font-sans bg-gray-50 text-gray-900 antialiased">

  <!-- =====================================================================
       Empty form version of the maintenance detail page. The user fills
       every field in to "log" a brand new maintenance request from scratch.
       ===================================================================== -->

  <!-- ============ TOP HEADER (full width) ============ -->
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center gap-6">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 21V10l9-7 9 7v11h-7v-7H10v7H3z"/>
      </svg>
      <span class="text-lg font-semibold">TenureX</span>
    </div>

    <div class="flex-1 max-w-2xl mx-auto relative">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
           fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/>
      </svg>
      <input type="text" placeholder="Search portfolio..."
             class="w-full pl-9 pr-4 py-2.5 bg-gray-100 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300"/>
    </div>

    <div class="flex items-center gap-4">
      <button class="text-gray-500 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14V11a6 6 0 00-12 0v3a2 2 0 01-.6 1.6L4 17h5m6 0a3 3 0 11-6 0"/>
        </svg>
      </button>
      <button class="text-gray-500 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.1 9a3 3 0 015.8 1c0 2-3 2-3 4M12 17h.01"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ MAIN BODY ============ -->
  <main class="max-w-7xl mx-auto px-10 py-10">

    <!-- Back arrow + page title -->
    <div class="flex items-center gap-4 mb-8">
      <a href="maintenance.html" class="text-gray-700 hover:text-black" aria-label="Back to Maintenance">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-xl font-semibold">Log New Maintenance Request</h1>
    </div>

    <!-- The whole form is one element so we can attach a single submit handler -->
    <form id="logRequestForm" class="grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-10">

      <!-- ===== LEFT COLUMN ===== -->
      <div class="flex flex-col gap-8">

        <!-- BIG HEADING (matches the detail-page hero look) -->
        <div>
          <p class="text-[11px] tracking-widest text-gray-500 mb-3">ISSUE TITLE</p>
          <input type="text" name="title"
                 placeholder="e.g. HVAC Unit Failure — Tower B Penthouse"
                 class="w-full text-3xl md:text-4xl font-bold tracking-tight bg-transparent border-b border-gray-200 pb-3 focus:outline-none focus:border-black placeholder:text-gray-300"
                 required/>
        </div>

        <!-- DETAILED DESCRIPTION -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <p class="text-[11px] tracking-widest text-gray-500 mb-3">DETAILED DESCRIPTION</p>
          <textarea name="description" rows="6"
                    placeholder="Describe the issue, when it started, and any troubleshooting already attempted..."
                    class="w-full text-sm leading-relaxed bg-gray-50 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-gray-300 resize-none"
                    required></textarea>
        </div>

        <!-- PHOTO UPLOAD AREA -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <p class="text-[11px] tracking-widest text-gray-500 mb-3">PHOTO EVIDENCE</p>
          <label for="photoInput"
                 class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-xl py-12 cursor-pointer hover:bg-gray-50">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4-4 4 4 4-4 4 4M4 8h16v12H4z"/>
            </svg>
            <p class="text-sm font-medium mt-3">Click to upload photos</p>
            <p class="text-xs text-gray-500 mt-1">PNG, JPG up to 10MB each</p>
            <input id="photoInput" type="file" accept="image/*" multiple class="hidden"/>
          </label>
        </div>

        <!-- TENANT REPORTING -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <p class="text-[11px] tracking-widest text-gray-500 mb-3">REPORTED BY</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-gray-500">Tenant Name</label>
              <input type="text" name="tenantName" placeholder="e.g. Eleanor Vance"
                     class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"/>
            </div>
            <div>
              <label class="text-xs text-gray-500">Tenant Email</label>
              <input type="email" name="tenantEmail" placeholder="e.g. e.vance@example.com"
                     class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"/>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== RIGHT COLUMN ===== -->
      <div class="flex flex-col gap-6">

        <!-- META CARD: property, unit, priority, category -->
        <div class="bg-white rounded-2xl shadow-sm p-6 flex flex-col gap-5">
          <p class="text-[11px] tracking-widest text-gray-500">REQUEST DETAILS</p>

          <!-- Property -->
          <div>
            <label class="text-xs text-gray-500">Property</label>
            <select name="property"
                    class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300" required>
              <option value="">Select a property</option>
              <option>The Bauhaus Lofts</option>
              <option>Brutalist Heights</option>
              <option>Modernist Square</option>
              <option>The Obsidian Suite</option>
            </select>
          </div>

          <!-- Unit -->
          <div>
            <label class="text-xs text-gray-500">Unit / Room</label>
            <input type="text" name="unit" placeholder="e.g. Unit 402 — Penthouse"
                   class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"/>
          </div>

          <!-- Category -->
          <div>
            <label class="text-xs text-gray-500">Category</label>
            <select name="category"
                    class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300" required>
              <option value="">Select a category</option>
              <option>HVAC / Climate Control</option>
              <option>Plumbing</option>
              <option>Electrical</option>
              <option>Appliance</option>
              <option>Structural</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Priority — radio buttons styled as chips -->
          <div>
            <label class="text-xs text-gray-500 block mb-2">Priority</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="LOW" class="peer hidden" required/>
                <div class="text-center text-[11px] tracking-widest font-semibold py-2 rounded border border-gray-200 peer-checked:bg-black peer-checked:text-white peer-checked:border-black">LOW</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="MEDIUM" class="peer hidden"/>
                <div class="text-center text-[11px] tracking-widest font-semibold py-2 rounded border border-gray-200 peer-checked:bg-black peer-checked:text-white peer-checked:border-black">MEDIUM</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="URGENT" class="peer hidden"/>
                <div class="text-center text-[11px] tracking-widest font-semibold py-2 rounded border border-gray-200 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600">URGENT</div>
              </label>
            </div>
          </div>

          <!-- Reported date -->
          <div>
            <label class="text-xs text-gray-500">Reported On</label>
            <input type="date" name="reportedOn"
                   class="w-full mt-1 px-4 py-3 bg-gray-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"/>
          </div>
        </div>

        <!-- Submit / cancel buttons -->
        <div class="flex flex-col gap-3">
          <button type="submit"
                  class="bg-black text-white rounded-xl py-4 text-sm font-bold tracking-widest hover:bg-gray-800">
            LOG REQUEST
          </button>
          <a href="maintenance.html"
             class="bg-gray-100 text-gray-800 rounded-xl py-4 text-sm font-bold tracking-widest text-center hover:bg-gray-200">
            CANCEL
          </a>
        </div>
      </div>
    </form>
  </main>

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl px-10 py-8 text-center">
      <svg class="w-10 h-10 animate-spin mx-auto text-black" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
      </svg>
      <p class="text-sm font-semibold mt-4">Logging your request...</p>
    </div>
  </div>

  <!-- ============ SUCCESS POPUP ============ -->
  <div id="successModal" class="hidden fixed inset-0 bg-gray-500/70 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg px-12 py-12 text-center">
      <div class="w-28 h-28 mx-auto bg-green-200 rounded-full flex items-center justify-center">
        <svg class="w-14 h-14 text-green-700" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h3 class="text-3xl font-semibold mt-8">Request Logged!</h3>
      <p class="text-sm text-gray-500 mt-3">Your maintenance request has been added to the queue.</p>
      <a href="maintenance.html"
         class="inline-block mt-8 bg-black text-white text-sm tracking-widest font-semibold px-10 py-3 rounded">
        BACK TO MAINTENANCE
      </a>
    </div>
  </div>

  <!-- ============ PAGE-SPECIFIC SCRIPT ============ -->
  <script>
    // Helpers
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    var form           = document.getElementById('logRequestForm');
    var loadingOverlay = document.getElementById('loadingOverlay');
    var successModal   = document.getElementById('successModal');

    // Intercept submit so we can show our loading + success popups
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      show(loadingOverlay);
      // Fake processing delay so the spinner is visible
      setTimeout(function () {
        hide(loadingOverlay);
        show(successModal);
      }, 1200);
    });
  </script>
  <script src="/TenureX-Web-Project/js/app.js"></script>
  <script src="/TenureX-Web-Project/js/landlord.js"></script>
</body>
</html>
